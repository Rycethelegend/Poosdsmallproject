<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Manager - Log In</title>
    <link rel="stylesheet" href="css/natestyles.css">
</head>

<style>
    .centerBox {
        position: absolute;
        justify-items: center;
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
    }

    .infoField {
        text-align: center;
        display: flex;
        align-items: center;
        height: 32px;
        white-space: nowrap;
        padding: 2px;
        font-size: 20px;
        padding-left: 16px;
        padding-right: 16px;
        border-radius: 32px;
        width: 100%;
        background-color: #fef9ef;
        border: none;
    }

    .slideOut {
        transform: translateX(-100%);
        transition: transform 0.5s ease-in-out
    }

    .slideIn {
        transform: translateX(0%);
        transition: transform 0.5s ease-in-out
    }

    .slidePrepare {
        transform: translateX(100%);
        transition: transform 0.5s ease-in-out
    }

    .listItem {
        position: relative;
        border-radius: 16px;
        padding: 8px;
        padding-left: 16px;
        padding-right: 16px;
        display: flex;
        gap: 16px;
        height: 96px;
        background-color: #0081a7;
    }

    .listRegion {
        background-color: #00afb9;
        border-radius: 32px;
        display: flex;
        min-width: fit-content;
        flex-direction: column;
        padding: 16px;
        gap: 16px;
    }

    .deleteBox {
        padding: 16px;
        gap: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: absolute;
        width: 400px;
        height: fit-content;
        background-color: #f07167;
        border-radius: 16px;
        border: 6px solid rgba(0, 0, 0, 0.1);
    }

    .imageButton {
        outline: none;
        border: none;
        background-color: transparent;
    }

    /*
    @view-transition {
        navigation: auto;
    }*/
</style>

<body onload="requireLogin(); query();">

    <template id="contactRowTemplate">
        <div class="listItem">
            <div style="aspect-ratio: 1; background-color: #fef9ef; border-radius: 64px;">
            </div>
            <div style="display: flex; gap: 8px; flex-direction: column; justify-content: center; padding-right: 64px;">
                <div style="display: flex; gap: 8px; ">
                    <div class="infoField contactFirstName"></div>
                    <div class="infoField contactLastName"></div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <div class="infoField contactEmail"></div>
                    <div class="infoField contactPhone"></div>
                </div>
            </div>
            <div style="width: 100%; justify-items: end;">
                <div
                    style="width: 40px; height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
                    <button class="imageButton editButton">
                        <img src="images/pencilwhite.svg" style="width: 100%;">
                    </button>
                    <button class="imageButton deleteButton">
                        <img src="images/trashwhite.svg" style="width: 100%;">
                    </button>
                </div>
            </div>
        </div>
    </template>

    <div id="deleteRegion"
        style="position: absolute; display: none; z-index: 10; width: 100%; height: 100%; justify-content: center; align-items: center;">
        <div class="blurBox"></div>
        <div class="deleteBox">
            <h2 style="text-align: center; padding: 0px; margin: 0px;">Deleting a contact is permanent!<br>Continue?
            </h2>

            <div style="display: flex; gap: 16px;">
                <button class="colorButton" style="background-color: transparent; border: 4px solid black;"
                    onclick="closeDeleteBox()">
                    <img src="images/letterx.svg" style="width: 100%;">
                    <p>Cancel</p>
                </button>
                <button class="colorButton" style="background-color: black; color: white;"
                    onclick="finishContactDelete()">
                    <img src="images/trashwhite.svg" style="width: 100%;">
                    <p>Delete</p>
                </button>
            </div>
        </div>
    </div>

    <div id="navbar" class="navbar">
        <button class="navbarButton" style="padding-left: 12px;">

            <img src="images/twousers.svg">
            <a href="contacts.html">Contacts</a>
        </button>

        <button class="navbarButton" style="padding-left: 8px;" onclick="doLogout()">

            <img src="images/logout.svg">
            <a>Logout</a>
        </button>
    </div>

    <div style="position: relative; margin-left: 8px; margin-right: 8px">

        <div id="leftContainer" class="slideIn centerBox">

            <div style="display: flex; flex-direction: column; max-width: 1000px; width: 100%; gap: 32px;">

                <h2 style="text-align: center;">
                    Contacts
                </h2>

                <h3 class="errorText" id="errorBox">Example error!</h3>

                <div style="display: flex; align-items: center; width: 100%; gap: 16px;">

                    <div id="search" class="searchBox" style="width: 100%;">
                        <input
                            style="border: none; outline: none; background: transparent; font-size: 16px; width: 100%;"
                            type="text" id="searchText" aria-describedby="username-help" placeholder="Search..." />
                    </div>

                    <button id="search-button" class="colorButton" value="Search"
                        style="background-color: black; padding-left: 8px;" onclick="query()">

                        <img src="images/searchWhite.svg">
                        <h3 style="color:white;">Search</h3>
                    </button>

                    <button id="add-button" class="colorButton" value="Add"
                        style="background-color: transparent; border: 4px solid black" onclick="openAddBox()">

                        <img src="images/adduser.svg">
                        <h3 style="color:black;">Add</h3>
                    </button>

                </div>

                <div id="addRegion" class="listRegion" style="display: none;">
                    <div class="listItem">

                        <div style="aspect-ratio: 1; background-color: #fef9ef; border-radius: 64px;">

                        </div>

                        <div
                            style="display: flex; gap: 8px; flex-direction: column; justify-content: center; width: 100%;">
                            <div style="display: flex; gap: 8px;">
                                <div class="infoField">
                                    <input
                                        style="border: none; outline: none; background: transparent; width: 100%; font-size: 20px; "
                                        type="text" id="addFirstName" name="username" aria-describedby="username-help"
                                        placeholder="First name..." />
                                </div>
                                <div class="infoField">
                                    <input
                                        style="border: none; outline: none; background: transparent; width: 100%; font-size: 20px; "
                                        type="text" id="addLastName" name="username" aria-describedby="username-help"
                                        placeholder="Last name..." />
                                </div>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <div class="infoField">
                                    <input
                                        style="border: none; outline: none; background: transparent; width: 100%; font-size: 20px; "
                                        type="text" id="addEmail" name="username" aria-describedby="username-help"
                                        placeholder="Email..." />
                                </div>
                                <div class="infoField">
                                    <input
                                        style="border: none; outline: none; background: transparent; width: 100%; font-size: 20px; "
                                        type="text" id="addPhone" name="username" aria-describedby="username-help"
                                        placeholder="Phone number..." />
                                </div>
                            </div>
                        </div>

                    </div>

                    <div style="display: flex; justify-content: space-between;">
                        <h3 class="errorText" id="addError"></h3>

                        <div id="addButtons" style="display: none; justify-content: end; gap: 8px;">
                            <button class="colorButton" onclick="saveContact()">
                                <span>Save</span>
                            </button>
                            <button class="colorButton" onclick="closeAddBox()">
                                <span>Cancel</span>
                            </button>
                        </div>

                        <div id="editButtons" style="display: none; justify-content: end; gap: 8px;">
                            <button class="colorButton" onclick="finishContactEdit()">
                                <span>Save</span>
                            </button>
                            <button class="colorButton" onclick="closeAddBox()">
                                <span>Cancel</span>
                            </button>
                        </div>
                    </div>


                </div>

                <div id="listRegion" class="listRegion">
                    <h3 id="listError" style="text-align: center;">
                    </h3>
                </div>
            </div>

        </div>

        <div id="rightContainer" class="slidePrepare centerBox">

            <div style="width: 100%; height: 100%; display: flex; background-color: #ff0000;">

            </div>
        </div>

    </div>

    <script src="js/login.js"></script>
    <script src="js/contacts.js"></script>
</body>
