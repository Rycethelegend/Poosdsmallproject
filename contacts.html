<html>
<head>
	<meta charset="UTF-8">
	<title>Contact Manager - My Contacts</title>
	<link rel="stylesheet" href="css/styles.css">
</head>
<body onload="searchContacts();">

	<div class="top-bar">
		<h1>Contacts</h1>
		<button onclick="logout()">Log Out</button>
	</div>

	<div class="contacts-UI">
		<br />
		<input type="text" id="searchText" placeholder="Search Contact"/>
		<button type="button" id="searchColorButton" class="buttons" onclick="searchContacts();"> Search Contact </button>
		
		<div class="message"> </div>

		<span id="contactSearchResult"></span>
		<p id="contactList">
		</p> <br /> <br />
	</div>

	<div class="contacts-AddUI">
		<h2>Add Contact</h2>
		<div class="message" id="contactFormResult">
			<input type="text" id="contactFirstName" placeholder="First Name">
			<input type="text" id="contactLastName" placeholder="Last Name">
		</div>

		<button id="contactSaveButton" onclick="saveContact()">Add Contact</button>
		<button onclick="resetContactForm()">Clear Form</button>
	</div>

	<script src="js/code.js"></script>
</body>
</html>
