<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Manager - Log In</title>
    <link rel="stylesheet" href="css/natestyles.css">
</head>

<style>
    h1 {
        font-size: 40px;
    }

    .centerBox {
        /*align-items: center;*/
        margin: 32px;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        gap: 32px;
        max-width: 1200px;
    }

    .searchBox {
        display: flex;
        padding-left: 16px;
        height: 48px;
        border-radius: 32px;
        width: 100%;
        background-color: #fef9ef;
        border: 4px solid black;
    }
</style>

<body>

    <div id="navbar" class="navbar">
        <button class="navbarButton">
            Contacts
        </button>
        <button class="navbarButton">
            Logout
        </button>
    </div>

    <div style="margin: 32px; justify-items: center; min-height: 100dvh;">

        <div class="centerBox">

            <h1 style="text-align: center;">
                Contacts
            </h1>

            <div style="display: flex; align-items: center; width: 100%; gap: 16px;">

                <div id="search" class="searchBox">
                    <input style="border: none; outline: none; background: transparent; font-size: 16px; width: 100%;"
                        type="text" id="username" name="username" aria-describedby="username-help"
                        placeholder="Search..." />
                </div>

                <button id="search-button" class="colorButton" value="Search" style="background-color: black;">
                    <h2 style="color:white;">Search</h2>
                </button>

                <button id="add" class="colorButton" value="Search"
                    style="background-color: transparent; border: 4px solid black">
                    <h2 style="color:black;">Add</h2>
                </button>

            </div>

            <div id="listRegion" style="height: 500px; width: 100%; background-color: #00afb9; border-radius: 32px;">

            </div>

        </div>
    </div>

    <div class="pane" id="detailPane">
        <div class="pane-inner">

            <div class="detail-bar">
                <button type="button" class="icon-btn" id="backBtn" aria-label="Back to all contacts">
                    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 5 8 12 15 19"></polyline>
                    </svg>
                </button>

                <div class="dropdown">
                    <button type="button" class="icon-btn" id="detailMenuBtn" data-bs-toggle="dropdown"
                        data-bs-auto-close="true" aria-expanded="false" aria-label="More options">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
                            <circle cx="5" cy="12" r="1.9"></circle>
                            <circle cx="12" cy="12" r="1.9"></circle>
                            <circle cx="19" cy="12" r="1.9"></circle>
                        </svg>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><button class="dropdown-item text-delete" type="button" id="detailDeleteBtn">Delete
                                contact</button></li>
                    </ul>
                </div>
            </div>

            <!-- Rendered by js/contacts.js -->
            <div id="detailRegion"></div>

        </div>
    </div>


    <script src="js/contacts.js"></script>
</body>

</html>
