<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Manager - Log In</title>
    <link rel="stylesheet" href="css/natestyles.css">
</head>

<style>
    .centerBox {
        /*align-items: center;*/
        margin: 32px;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        gap: 32px;
        max-width: 1200px;
    }

    .searchBox {
        display: flex;
        padding-left: 16px;
        height: 48px;
        border-radius: 32px;
        width: 100%;
        background-color: #fef9ef;
        border: 4px solid black;
    }
</style>

<body>

    <div id="navbar" class="navbar">
        <button class="navbarButton">
            Contacts
        </button>
        <button id="logoutButton" class="navbarButton">
            Logout
        </button>
    </div>

    <div style="margin: 32px; justify-items: center; min-height: 100dvh;">

        <div class="centerBox">

            <h2 style="text-align: center;">
                Contacts
            </h2>

            <div style="display: flex; align-items: center; width: 100%; gap: 16px;">

                <div id="search" class="searchBox">
                    <input style="border: none; outline: none; background: transparent; font-size: 16px; width: 100%;"
                        type="text" id="username" name="username" aria-describedby="username-help"
                        placeholder="Search..." />
                </div>

                <button id="search-button" class="colorButton" value="Search" style="background-color: black;">
                    <h3 style="color:white;">Search</h3>
                </button>

                <button id="add" class="colorButton" value="Search"
                    style="background-color: transparent; border: 4px solid black">
                    <h3 style="color:black;">Add</h3>
                </button>

            </div>

            <div id="listRegion"
                style="height: 500px; width: 100%; background-color: #00afb9; border-radius: 32px; display: flex; flex-direction: column;">

            </div>

        </div>
    </div>

    <div class="pane" id="detailPane">
        <div class="pane-inner">

            
        </div>
    </div>


    <script src="js/contacts.js"></script>
</body>
