<html>

<head>
    <meta charset="UTF-8">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="css/natestyles.css">
</head>

<style>
    .centerBox {
        /*align-items: center;*/
        margin: 32px;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        max-width: 800px;
    }

    .input {
        border: none;
        outline: none;
        font-size: 16px;
        width: 100%;
        padding: 16px;
        border-radius: 16px;
    }

    .detailBox {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px;
        background-color: #f07167;
        border: 8px solid rgba(0, 0, 0, 0.1);
        border-radius: 16px;
    }
</style>

<body onload="redirectIfLoggedIn()">

    <div style="padding: 32px; justify-items: center;">
        <h2 style="text-align: center;">
            Contact Manager Login
        </h2>

        <div class="detailBox">
            <div class="searchBox">
                <input 
                    class="inputText"
                    type="text" 
                    id="regFirstName" 
                    aria-describedby="username-help" 
                    placeholder="Username..." />
            </div>

            <div class="searchBox">
                <input 
                    class="inputText"
                    type="password" 
                    id="regLastName" 
                    aria-describedby="password-help" 
                    placeholder="Password..." />
            </div>

            <div class="message" id="registerResult"></div>

            <div style="display: flex; gap: 8px; justify-content: center; ">

                <button onclick="doLogin()" class="colorButton" style="background-color: black; ">
                    <a style="color: white;">
                        Login
                    </a>
                </button>

                <button class="colorButton" style="background-color: transparent; border: 4px solid black;">
                    <a href="register.html" style="color: black;">
                        Don't have an account? Sign up
                    </a>
                </button>

            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
