<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Manager - Log In</title>
    <link rel="stylesheet" href="css/natestyles.css">
</head>

<style>
    .centerBox {
        /*align-items: center;*/
        margin: 32px;
        display: flex;
        height: 100%;
        width: 100%;
        flex-direction: column;
        gap: 32px;
        max-width: 1200px;
    }
</style>

<body style="overflow: hidden;">

    <div id="navbar" class="navbar">
        <button class="navbarButton" style="padding-left: 12px;" onclick="redirectIfLoggedIn()">

            <img src="images/twousers.svg" alt="">
            <a>Contacts</a>
        </button>

        <button class="navbarButton" style="padding-left: 8px;" onclick="doLogout()">

            <img src="images/logout.svg" alt="">
            <a>Logout</a>
        </button>
    </div>

    <div style="position: absolute; right: 64px; bottom: 16px; width: 30%; z-index: -5;">
        <img src="images/elephan2.png" alt="A strawberry colored elephant with seeds covering its skin." style="width: 100%;">
    </div>

    <div style="position: absolute; inset: 0; align-content: end; z-index: -10;">
        <img src="images/grass/foregrounds_54.png" alt="A large grass plain where the elephant is standing." style="width: 100%; ">
    </div>

    <div style="margin: 32px;">

        <h1>
            Life is complicated.
        </h1>

        <h2>
            Let's help you organize. <it class="z"></it>
        </h2>

        <div style="display: flex; gap: 16px;">
            <button onclick="window.location.replace('login.html');" class="colorButton" style="color: white; background-color: black;">
                Log into account
            </button>

            <button onclick="window.location.replace('register.html');" class="colorButton" style="background-color: transparent; border: 4px solid black;">
                Register an account
            </button>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
